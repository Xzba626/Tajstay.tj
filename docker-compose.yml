services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tajstay
    ports:
      - "5432:5432"
    volumes:
      - tajstay-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/tajstay?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      COMMISSION_RATE: "0.12"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  tajstay-postgres:
