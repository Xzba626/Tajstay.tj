# Пример для VPS: Nginx перед Next.js (Docker или `next start` на :3000).
# Симптом «голого HTML»: чаще всего запросы к /_next/* не проксируются и отдают 404 или чужую страницу.
#
# Проверка: в браузере откройте https://ваш-домен/_next/static/chunks/webpack.js
# (или любой путь из вкладки Network у главной страницы) — должен быть JS, не HTML-страница сайта.

server {
    listen 443 ssl http2;
    server_name tajstay.site www.tajstay.site;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Явно: весь статик Next — тот же upstream (дублирование с location /, но полезно для отладки)
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
