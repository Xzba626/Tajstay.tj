<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajstay — Структура базы данных</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f7f6f2;
    color: #1a1a18;
    padding: 32px 24px;
    min-height: 100vh;
  }
  header {
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 500;
    color: #1a1a18;
    margin-bottom: 4px;
  }
  header p {
    font-size: 13px;
    color: #73726c;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #erd {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid #d3d1c7;
    padding: 24px;
    overflow-x: auto;
  }
  #erd svg { width: 100%; }
</style>
</head>
<body>
<header>
  <h1>Tajstay</h1>
  <p>Структура базы данных · 17 таблиц</p>
</header>
<div id="erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2C2C2A' : '#F1EFE8',
    primaryBorderColor: dark ? '#5F5E5A' : '#B4B2A9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
    edgeLabelBackground: dark ? '#2C2C2A' : '#F1EFE8',
  },
});

const diagram = `erDiagram
  USERS {
    uuid id PK
    string email
    string phone
    string name
    enum role
    enum status
    string password_hash
    timestamp created_at
  }

  HOST_PROFILES {
    uuid id PK
    uuid user_id FK
    enum status
    string company_name
    string document_url
    float rating
    timestamp verified_at
  }

  PROPERTIES {
    uuid id PK
    uuid host_id FK
    string title
    enum type
    enum status
    string address
    string city
    float lat
    float lng
    int max_guests
    text description
    float base_price
    float rating
    int review_count
  }

  PROPERTY_AMENITIES {
    uuid id PK
    uuid property_id FK
    string amenity
  }

  PROPERTY_PHOTOS {
    uuid id PK
    uuid property_id FK
    string url
    bool is_cover
    int sort_order
  }

  AVAILABILITY {
    uuid id PK
    uuid property_id FK
    date date
    bool is_blocked
    float price_override
  }

  BOOKINGS {
    uuid id PK
    uuid guest_id FK
    uuid property_id FK
    date check_in
    date check_out
    int guests_count
    float total_price
    float platform_fee
    enum status
    enum payment_status
    timestamp created_at
  }

  PAYMENTS {
    uuid id PK
    uuid booking_id FK
    float amount
    enum method
    enum status
    string provider_tx_id
    timestamp paid_at
  }

  PAYOUTS {
    uuid id PK
    uuid host_id FK
    uuid booking_id FK
    float amount
    enum status
    string bank_details
    timestamp paid_at
  }

  REVIEWS {
    uuid id PK
    uuid booking_id FK
    uuid author_id FK
    uuid property_id FK
    int rating
    text comment
    bool is_visible
    timestamp created_at
  }

  REVIEW_RESPONSES {
    uuid id PK
    uuid review_id FK
    uuid host_id FK
    text text
    timestamp created_at
  }

  FAVORITES {
    uuid id PK
    uuid user_id FK
    uuid property_id FK
    timestamp created_at
  }

  MESSAGES {
    uuid id PK
    uuid booking_id FK
    uuid sender_id FK
    text body
    bool is_read
    timestamp sent_at
  }

  DISPUTES {
    uuid id PK
    uuid booking_id FK
    uuid filed_by FK
    string reason
    text description
    enum status
    text resolution
    timestamp created_at
  }

  NOTIFICATIONS {
    uuid id PK
    uuid user_id FK
    enum type
    string title
    text body
    bool is_read
    timestamp created_at
  }

  PROMOCODES {
    uuid id PK
    string code
    enum discount_type
    float discount_value
    int usage_limit
    int usage_count
    date expires_at
    bool is_active
  }

  USERS ||--o| HOST_PROFILES : "becomes"
  HOST_PROFILES ||--o{ PROPERTIES : "owns"
  PROPERTIES ||--o{ PROPERTY_AMENITIES : "has"
  PROPERTIES ||--o{ PROPERTY_PHOTOS : "has"
  PROPERTIES ||--o{ AVAILABILITY : "blocks"
  PROPERTIES ||--o{ BOOKINGS : "booked in"
  USERS ||--o{ BOOKINGS : "makes"
  BOOKINGS ||--o{ PAYMENTS : "paid via"
  BOOKINGS ||--o| PAYOUTS : "triggers"
  BOOKINGS ||--o| REVIEWS : "generates"
  REVIEWS ||--o| REVIEW_RESPONSES : "replied to"
  USERS ||--o{ FAVORITES : "saves"
  PROPERTIES ||--o{ FAVORITES : "saved as"
  BOOKINGS ||--o{ MESSAGES : "has chat"
  BOOKINGS ||--o| DISPUTES : "disputed"
  USERS ||--o{ NOTIFICATIONS : "receives"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
</body>
</html>
